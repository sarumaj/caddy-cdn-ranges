# Converted from .github/workflows/release.yml for Forgejo by
# scripts/github_to_forgejo.py (HomeLab); --move-ci rewrites it. Jobs needing
# GitHub, macOS, Windows or secrets Forgejo lacks stay in the GitHub file.
name: release
'on':
  push:
    tags:
    - v*
  # Run by hand to retry a tag's release from main, with the tag in the field
  # (a tag made before this trigger existed has no workflow_dispatch of its own).
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z); empty for the tag chosen above
        type: string
        required: false
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        go:
        - 1.26
        os:
        - ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Release caddy-cdn-ranges
    steps:
    - name: Check the tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        case "$TAG" in
          v[0-9]*) ;;
          *) echo "::error::$TAG is not a release tag: name one in the tag field"; exit 1 ;;
        esac
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
        fetch-depth: 0
    - name: Install go
      uses: https://github.com/actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
    - name: Install go tools
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - name: Export Module Name
      id: export_module_name
      run: |
        TAG_NAME="${{ inputs.tag || github.ref_name }}"
        MODULE_DIR="."
        if [[ "$TAG_NAME" == v2.* ]]; then
          MODULE_DIR="v2"
        fi
        echo "MODULE_DIR=$MODULE_DIR" >> "$GITHUB_OUTPUT"
        echo "MODULE_NAME=$(cd "$MODULE_DIR" && go mod edit -json | jq -r '.Module.Path')" >> "$GITHUB_OUTPUT"
    - name: Run linters
      run: |
        gofmt -s -d $(find . -type f -name '*.go'| grep -v "/vendor/")
        golangci-lint run -v --timeout 5m && golangci-lint run -v --timeout 5m --exclude-dirs-use-default -e printf
      shell: bash
      working-directory: ${{ steps.export_module_name.outputs.MODULE_DIR }}
    - name: Run tests with coverage
      run: go test ./... -coverprofile=coverage.out
      working-directory: ${{ steps.export_module_name.outputs.MODULE_DIR }}
    - name: Collect the release files
      # The tag's commit, for the release: forgejo-release refuses a tag that points
      # elsewhere than the commit it is given, by default the run's (a retry from main).
      id: release_files
      shell: bash
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        mkdir -p .forgejo-release
        git fetch --quiet --force origin "+refs/tags/$TAG:refs/tags/$TAG"
        echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
    - name: Write the release notes
      id: release_notes
      shell: bash
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --quiet --unshallow --tags
        else
          git fetch --quiet --tags
        fi
        previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
        notes=$(awk -v v="${TAG#v}" '/^## / { if (found) exit; h = $2; gsub(/^\[|\]$/, "", h); sub(/^v/, "", h)
          if (h == v) { found = 1; next } } found' CHANGELOG.md 2>/dev/null | sed '/./,$!d' || true)
        if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
          notes=$(git log --no-merges --format='- %s' ${previous:+"$previous.."}"$TAG")
        fi
        {
          echo 'notes<<END_OF_NOTES'
          printf '%s\n' "$notes"
          echo END_OF_NOTES
        } >> "$GITHUB_OUTPUT"
    - name: Publish the release
      uses: https://code.forgejo.org/actions/forgejo-release@v2
      with:
        direction: upload
        url: ${{ github.server_url }}
        repo: ${{ github.repository }}
        tag: ${{ inputs.tag || github.ref_name }}
        sha: ${{ steps.release_files.outputs.sha }}
        title: ${{ inputs.tag || github.ref_name }}
        release-dir: .forgejo-release
        # No files to attach: the upload of the empty directory's unmatched glob fails.
        skip-assets: true
        prerelease: false
        override: true
        release-notes: ${{ steps.release_notes.outputs.notes }}
    - name: Update code documentation
      run: |
        MODULE_PATH="${{ steps.export_module_name.outputs.MODULE_NAME }}"
        TAG_NAME="${{ inputs.tag || github.ref_name }}"
        curl -fsSL "https://proxy.golang.org/$MODULE_PATH/@v/$TAG_NAME.info"
