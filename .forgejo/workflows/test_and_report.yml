# Converted from .github/workflows/test_and_report.yml for Forgejo by
# scripts/github_to_forgejo.py (HomeLab); --move-ci rewrites it. Jobs needing
# GitHub, macOS, Windows or secrets Forgejo lacks stay in the GitHub file.
name: test_and_report
'on':
  push:
    branches:
    - main
    - renovate/all-patch
  # Pull requests too, for the test report's comment.
  pull_request: null
  workflow_dispatch: null
jobs:
  test_and_report:
    strategy:
      fail-fast: false
      matrix:
        go:
        - 1.26
        os:
        - ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Test caddy-cdn-ranges
    steps:
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install go
      uses: https://github.com/actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
    - name: Install go tools
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - name: Run linters
      run: |
        gofmt -s -d $(find . -type f -name '*.go'| grep -v "/vendor/")
        golangci-lint run -v --timeout 5m && golangci-lint run -v --timeout 5m --exclude-dirs-use-default -e printf
      shell: bash
    - name: Run linters (v2)
      run: |
        cd v2
        golangci-lint run -v --timeout 5m && golangci-lint run -v --timeout 5m --exclude-dirs-use-default -e printf
      shell: bash
    # As JSON with the coverage, for the report below, which also prints the failed
    # tests' output.
    - name: Run tests with coverage
      id: tests
      run: go test -json -coverprofile=/tmp/cover.out ./... > /tmp/go-test.json
    # Also when the first module's tests failed; its coverage added to the first's.
    - name: Run tests with coverage (v2)
      if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
      run: |
        cd v2
        go test -json -coverprofile=/tmp/cover-v2.out ./... > /tmp/go-test-v2.json
        tail -n +2 /tmp/cover-v2.out >> /tmp/cover.out
    # The results and the coverage as one comment on the pull request
    # (dawid/ci-actions), also when tests failed.
    - name: Test report
      if: always() && steps.tests.outcome != 'skipped'
      uses: https://git.ciepiela.org/dawid/ci-actions/test-report@main
      with:
        go-test-json: /tmp/go-test.json /tmp/go-test-v2.json
        coverage: /tmp/cover.out
